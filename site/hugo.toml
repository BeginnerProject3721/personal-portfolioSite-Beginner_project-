baseURL = "https://beginnerproject3721.github.io/personal-portfolioSite-Beginner_project-/"
title = "BYJ_DEV | PORTFOLIO"
locale = "en"

# Required for the theme's layouts/robots.txt to be rendered — Hugo ignores
# a custom robots.txt template unless this is explicitly enabled.
# https://gohugo.io/templates/robots/
enableRobotsTXT = true
disableKinds = ["taxonomy", "term", "RSS"]

[outputs]
  page = ["HTML"]
  home = ["HTML"]
  section = ["HTML"]

[module]


## Base mounts - so your site's assets are available
[[module.mounts]]
source = "archetypes"
target = "archetypes"

[[module.mounts]]
source = "assets"
target = "assets"

[[module.mounts]]
source = "i18n"
target = "i18n"

[[module.mounts]]
source = "layouts"
target = "layouts"

[[module.mounts]]
source = "static"
target = "static"

# The following mounts are required for the theme to be able to load bootstrap
# Remember also to copy the theme's `package.json` to your site, and run `npm install`
[[module.mounts]]
source = "node_modules/bootstrap/scss"
target = "assets/scss/bootstrap"

[[module.mounts]]
source = "node_modules/bootstrap/dist/js"
target = "assets/js/bootstrap"

[[module.mounts]]
source = "node_modules/bootstrap/dist/js/bootstrap.bundle.min.js"
target = "assets/js/vendor/bootstrap.bundle.min.js"

[[module.mounts]]
source = "node_modules/bootstrap-print-css/css/bootstrap-print.css"
target = "assets/css/bootstrap-print.css"


[params]
title = 'BYJ_DEV | PORTFOLIO'
description = '게임 개발을 중심으로, AI와 함께 게임, 웹, 앱을 개발하는 BYJ_DEV의 포트폴리오입니다.'
images = ['/img/og-img.png']
themeColor = '#478079'

# Header logo text. Optional — falls back to .Site.Title when unset.
# Useful when your SEO/page `title` (long, keyword-rich) should differ
# from the short brand text shown in the header. See PR #561.
logo_text1 = 'BYJ_DEV'
logo_text2 = '| PORTFOLIO'

# Color scheme: default | ocean | forest | rose | slate | midnight | warm
colorScheme = 'default'

# Enable the live color scheme switcher (for the demo site)
[params.colorSchemeSwitcher]
enable = false

# Color scheme selector visibility — set to true to hide in that location
[params.colorSchemeSwitcher.selector.disable]
footer = true
header = true

[params.seo]
siteName = 'BYJ_DEV | PORTFOLIO'
siteDescription = '게임 개발을 중심으로, AI와 함께 게임, 웹, 앱을 개발하는 BYJ_DEV의 포트폴리오입니다.'
siteImage = '/img/og-img.png'

[params.seo.person]
name = 'BYJ_DEV'
url = 'https://beginnerproject3721.github.io/personal-portfolioSite-Beginner_project-/'
sameAs = ['https://github.com/BeginnerProject3721/personal-portfolioSite-Beginner_project-']

[params.favicons]
# Optional: provide a different source image for auto-generation
source = "icons/favicon.png"

# Optional: override any generated file with a static one
# favicon = "/favicon.ico"
# icon16 = "/icons/icon-16.png"
# icon32 = "/icons/icon-32.png"
# appleTouch = "/icons/apple-touch-icon.png"
# icon192 = "/icons/icon-192.png"
# icon512 = "/icons/icon-512.png"
# manifest = "/site.webmanifest"

[params.analytics]
## Analytics parameters.
### Supported so far: Vercel (Page Insights, Analytics)
### Google (Tag Manager, Analytics)
### And Plausible

# controls vercel page insights - disabled by default
# to enable, just set to true
vercelPageInsights = false
vercelAnalytics = false

# google analytics and tag manager. to enable, set "enabled" to true
# and add the tracking code (UA-something for analytics, GTM-something for tag manager)
[params.analytics.googleAnalytics]
code = "UA-XXXXX-Y"
enabled = false
[params.analytics.googleTagManager]
code = "GTM-XXXXX"
enabled = false

# plausible analytics. to enable, set "enabled" to true and set your site's domain
[params.analytics.plausible]
enabled = false
domain = "" # e.g. example.com - defaults to the site's host when empty
# script = "https://plausible.io/js/script.js" # optional override, e.g. for a self-hosted instance

[build]
writeStats = true

[build.buildStats]
enabledFor = ["scss"]
disableClasses = false
disableIDs = false
disableTags = false
enable = true

# Language selector visibility — set to true to hide in that location
[params.languages.selector.disable]
footer = true
header = true
mobileHeader = true

[languages]
[languages.en]
disabled = false
locale = 'en'
direction = 'ltr'
label = 'English'
weight = 0

[languages.en.params.footer]
notice = '© Adritian. Free Hugo theme by Adrián Moreno Peña.'

[languages.en.menus]
[[languages.en.menus.header]]
name = "홈"
URL = "/"
weight = 1

[[languages.en.menus.header]]
name = "소개"
URL = "/#about"
weight = 2

[[languages.en.menus.header]]
name = "작업물"
URL = "/#client-and-work-section"
weight = 3

[[languages.en.menus.footer]]
name = "홈"
URL = "/"
weight = 1

[[languages.en.menus.footer]]
name = "소개"
URL = "/#about"
weight = 2

[[languages.en.menus.footer]]
name = "작업물"
URL = "/#client-and-work-section"
weight = 3


# Plugins
[params.plugins]

# CSS Plugins
[[params.plugins.css]]
URL = "css/custom.css"
[[params.plugins.css]]
URL = "css/adritian-icons.css"
## Print css
[[params.plugins.css]]
URL = "css/bootstrap-print.css"

# JS Plugins
[[params.plugins.js]]
URL = "js/rad-animations.js"
[[params.plugins.js]]
URL = "js/sticky-header.js"
[[params.plugins.js]]
URL = "js/library/fontfaceobserver.js"

# SCSS Plugins
[[params.plugins.scss]]
URL = "scss/adritian.scss"


# theme/color style 
[params.colorTheme]

## the following configuration would disable automatic theme selection
#  [params.colorTheme.auto]
#    disable = true
#  [params.colorTheme.forced]
#    theme = "dark"

## the following parameter will disable theme override in the footer
#  [params.colorTheme.selector.disable]
#  footer = true

# Color theme selector visibility — set to true to hide in that location
[params.colorTheme.selector.disable]
footer = false
header = false
mobileHeader = false
## by default we allow override AND automatic selection

# View Transitions API - enabled by default
# Set to false to disable the native View Transitions API
# viewTransitions = false

# Navbar overflow handling - options: "dropdown" | "footer" | "none"
[params.navbarOverflow]
mode = "none" # Keep the simplified navigation visible without a More dropdown


# Performance optimizations
[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
  [markup.highlight]
    lineNos = false
    noClasses = false
    style = "github"

[imaging]
  resampleFilter = "Lanczos"
  anchor = "Smart"
  [imaging.jpeg]
    quality = 85
  [imaging.webp]
    quality = 85
  [imaging.avif]
    quality = 85

[minify]
  disableCSS = false
  disableHTML = false
  disableJS = false
  disableJSON = false
  disableSVG = false
  disableXML = false
  minifyOutput = true
  [minify.tdewolff]
    [minify.tdewolff.html]
      keepDefaultAttrVals = true
      keepWhitespace = false
    [minify.tdewolff.css]
      precision = 0
    [minify.tdewolff.js]
      precision = 0
